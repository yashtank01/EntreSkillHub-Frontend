<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EntreSkill Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Join EntreSkill Hub</h2>
        <p>Start your micro-business journey today.</p>

        <form action="profiling.html">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required placeholder="Enter your name">

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required placeholder="Create a password">

            <label for="role">I want to:</label>
            <select id="role" name="role">
                <option value="learner">Learn and start a business</option>
                <option value="mentor">Become a Mentor</option>
            </select>

            <button type="submit">Create Account</button>
        </form>
        
        <p>Already have an account? <a href="index.html">Log in here</a></p>
    </div>
</body>
</html>
