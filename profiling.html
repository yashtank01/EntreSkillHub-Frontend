<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Profiling - EntreSkill Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="toast-message" class="toast hidden"></div>

    <div class="auth-container" style="max-width: 500px;"> 
        
        
        <h2>Tell us about your skills!</h2>
        
        <p>We will use this to recommend the best business ideas for you.</p>
        
        <h3 style="text-align: left; color: #1e293b; margin-top: 20px;">Select your practical skills:</h3>
        
        
        <form id="profiling-form">
            
            <div class="skills-list">
                <div class="checkbox-group">
                    <input type="checkbox" id="skill-tailoring" value="Tailoring & Sewing">
                    <label for="skill-tailoring">Tailoring & Sewing</label>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="skill-handicrafts" value="Handicrafts & Arts">
                    <label for="skill-handicrafts">Handicrafts & Arts</label>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="skill-food" value="Food Preparation & Baking">
                    <label for="skill-food"> Food Preparation & Baking</label>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="skill-digital" value="Basic Digital Skills">
                    <label for="skill-digital">Basic Digital Skills</label>
                </div>
            </div>

            <button type="submit">Find Business Ideas</button>
            
        </form>
    </div>


    <script src="global.js" defer></script>
    <script src="dashboard.js" defer></script>
</body>
</html>
