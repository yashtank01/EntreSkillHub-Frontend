<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Profiling - EntreSkill Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="toast-message" class="toast hidden"></div>

  <div class="auth-container" style="max-width: 600px; text-align: center;"> 
        <h2>✨ Tell us about your skills!</h2>
        <p style="color: #64748b; margin-bottom: 30px;">Select what you are good at, and we will recommend the perfect micro-business ideas for you.</p>
        
        <form id="profiling-form">
            <!-- New Animated Grid Layout -->
            <div class="skills-grid">
                
              <!-- 4 Skill Cards -->
              <div class="skill-card" data-skill="Tailoring & Sewing">
                  <h3>🧵 Tailoring & Sewing</h3>
              </div>

              <div class="skill-card" data-skill="Handicrafts & Arts">
                  <h3>🎨 Handicrafts & Arts</h3>
              </div>

              <div class="skill-card" data-skill="Food Preparation & Baking">
                  <h3>🧁 Baking & Food</h3>
              </div>

              <div class="skill-card" data-skill="Basic Digital Skills">
                  <h3>💻 Digital Skills</h3>
              </div>

            </div>

            <!-- Added the ID find-ideas-btn here! -->
            <button type="button" id="find-ideas-btn" class="submit-btn" style="margin-top: 20px; width: 100%; font-size: 1.1rem;">🚀 Find My Business Ideas</button>
            
        </form>
    </div>

    <script src="global.js" defer></script>
    <script src="profiling.js" defer></script> <!-- Changed this to profiling.js! -->
</body>
</html>
