<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Profiling - EntreSkill Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Tell us about your skills!</h2>
        <p>We will use this to recommend the best business ideas for you.</p>

        <form action="index.html">
            <h3>Select your practical skills:</h3>
            <br>
            
           <div class="checkbox-wrapper">
                <input type="checkbox" id="skill-tailoring" name="skills" value="tailoring">
                <label for="skill-tailoring">Tailoring & Sewing</label>
            </div>
            
            <div class="checkbox-wrapper">
                <input type="checkbox" id="skill-handicraft" name="skills" value="handicraft">
                <label for="skill-handicraft">Handicrafts & Arts</label>
            </div>

            <div class="checkbox-wrapper">
                <input type="checkbox" id="skill-food" name="skills" value="food">
                <label for="skill-food">Food Preparation & Baking</label>
            </div>

            <div class="checkbox-wrapper">
                <input type="checkbox" id="skill-digital" name="skills" value="digital">
                <label for="skill-digital">Basic Digital Skills</label>
            </div>

            <button type="submit">Find Business Ideas</button>
        </form>
    </div>
</body>
</html>
