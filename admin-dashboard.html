<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - EntreSkill Hub</title>
      <script src="security.js" ></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">

    <div id="toast-message" class="toast hidden"></div>

    <!-- Removed hardcoded background so Dark Mode works! -->
    <div class="universal-nav" style="padding: 20px 40px; margin-bottom: 30px;">
        <h2 id="admin-title">⚙️ Admin Control Center</h2>
        <div class="nav-right-controls">
            <a href="dashboard.html" class="nav-link">➔ Live Website</a>
            <a href="mentor-dashboard.html" style="background: #3b82f6; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: bold;">👨‍🏫 Enter as Mentor</a>
            <button id="theme-toggle" class="theme-icon-btn" aria-label="Toggle Theme">
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </div>

    <div class="admin-container" style="max-width: 1100px; margin: 0 auto; padding: 0 20px;">
        
        <!-- REAL STATS GRID -->
        <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px;">
            <div class="stat-card" style="border-top-color: #3b82f6;">
                <h3>Total Students</h3>
                <div class="number" id="stat-users">Loading...</div>
            </div>
            <div class="stat-card" style="border-top-color: #10b981;">
                <h3>Active Mentors</h3>
                <div class="number" id="stat-mentors">Loading...</div>
            </div>
            <div class="stat-card" style="border-top-color: #f59e0b;">
                <h3>Ideas Bookmarked</h3>
                <div class="number" id="stat-ideas">Loading...</div>
            </div>
            <div class="stat-card" style="border-top-color: #8b5cf6;">
                <h3>Pending Content</h3>
                <div class="number" id="stat-pending">0</div>
            </div>
        </div>

        <div style="display: flex; gap: 30px; flex-wrap: wrap;">
            
            <!-- LEFT PANEL: PENDING MENTOR APPROVALS -->
            <div class="panel" style="flex: 1; min-width: 300px;">
                <h3 style="border-bottom: 2px solid #f59e0b; padding-bottom: 10px;">👤 Pending Mentor Verifications</h3>
                <div id="pending-mentors-container">
                    <!-- JS will inject REAL data here -->
                </div>
            </div>

            <!-- RIGHT PANEL: REAL UPLOADED CONTENT -->
            <div class="panel" style="flex: 1; min-width: 300px;">
                <h3 style="border-bottom: 2px solid #8b5cf6; padding-bottom: 10px;">📄 Pending Training Content</h3>
                <div id="pending-content-container">
                    <!-- JS will inject REAL mentor uploads here -->
                </div>
            </div>

        </div>
    </div>

    <script src="global.js" defer></script>
    <script src="admin.js" defer></script>
</body>
</html>
