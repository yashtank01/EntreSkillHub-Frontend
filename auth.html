<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - EntreSkill Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <div class="floating-toggle-container">
        <button id="theme-toggle" class="theme-icon-btn nav-toggle-btn" aria-label="Toggle Theme">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
    </div>

    <div id="toast-message" class="toast hidden"></div>

    <div class="auth-container">
        
        <div id="login-section">
            <h2>Welcome to EntreSkill Hub!</h2>
            <p>Login to your account</p>
            
            
                <div class="input-group">
                    <label for="login-email">Email Address:</label>
                    <input type="email" id="login-email" placeholder="Email Address" required>
                </div>
                
                <div class="input-group">
                    <label for="login-password">Password:</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="Password" required>
                        <span class="toggle-password" onclick="togglePassword('login-password', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c3.5 4 7.5 7 10 7s6.5-3 10-7"/><path d="M12 19v2"/><path d="M17 17.5l1.5 1.5"/><path d="M7 17.5l-1.5 1.5"/></svg>
                        </span>
                    </div>
                </div>
                <button type="submit">Login</button>
            </form>
            
            <div class="divider">or</div>

            <div id="g_id_onload"
                 data-client_id="732967650333-7k4j38q916jp9kt62ckisd2dgto55ud3.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="redirect"
                 data-login_uri="https://entireskillhub-backend.onrender.com/api/auth/google"
                 data-auto_prompt="false">
            </div>

            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="filled_blue"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="center"
                 style="display: flex; justify-content: center; margin-top: 15px;">
            </div>

            <p class="toggle-text">Don't have an account? <a onclick="toggleForms()" style="cursor: pointer;">Sign Up</a></p>
        </div>

        <div id="register-section" class="hidden">
            <h2>Create an Account</h2>
            <p>Start your entrepreneurial journey today</p>
            
            <form id="register-form">
                <div class="input-group">
                    <label for="reg-name">Full Name:</label>
                    <input type="text" id="reg-name" placeholder="Full Name" required>
                </div>
                
                <div class="input-group">
                    <label for="reg-email">Email Address:</label>
                    <input type="email" id="reg-email" placeholder="Email Address" required>
                </div>
                
                <div class="input-group">
                    <label for="reg-password">Password:</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" placeholder="Create Password" required>
                        <span class="toggle-password" onclick="togglePassword('reg-password', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c3.5 4 7.5 7 10 7s6.5-3 10-7"/><path d="M12 19v2"/><path d="M17 17.5l1.5 1.5"/><path d="M7 17.5l-1.5 1.5"/></svg>
                        </span>
                    </div>
                </div>
                <button type="submit">Register</button>
            </form>

            <div class="divider">or</div>

            <button type="button" class="google-btn" onclick="showNotification('ℹ️ Google Sign-In will be fully connected before deployment!', true)">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18px" height="18px">
                    <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                    <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                    <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                    <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                </svg>
                Sign up with Google
            </button>

            <p class="toggle-text">Already have an account? <a onclick="toggleForms()" style="cursor: pointer;">Login</a></p>
        </div>

    </div>

   <script src="global.js" defer></script>
    <script src="auth.js" defer></script>
</body>
</html>
